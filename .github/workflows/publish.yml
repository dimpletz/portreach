name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing protected version tag to publish (for example v0.1.0)
        required: true
        type: string
      confirm_publish:
        description: Select publish to allow the protected PyPI publish job to run
        required: true
        type: choice
        options:
          - no
          - publish
        default: no

permissions: {}

concurrency:
  group: pypi-${{ inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-release:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_publish == 'publish' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_commit: ${{ steps.release.outputs.tag_commit }}
      version: ${{ steps.release.outputs.version }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Fetch and validate selected release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$CONFIRM_PUBLISH" == "publish" ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags --depth=1 origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          TAG_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          MAIN_REF="$(git rev-parse refs/remotes/origin/main)"

          while ! git merge-base --is-ancestor "$TAG_COMMIT" "$MAIN_REF"; do
            SHALLOW_FILE="$(git rev-parse --git-path shallow)"
            if [[ ! -f "$SHALLOW_FILE" ]] || ! git rev-list "$MAIN_REF" | grep -Fxf "$SHALLOW_FILE" >/dev/null; then
              echo "Selected tag does not point to a commit reachable from main." >&2
              exit 1
            fi
            git fetch --no-tags --deepen=100 origin +refs/heads/main:refs/remotes/origin/main
            MAIN_REF="$(git rev-parse refs/remotes/origin/main)"
          done

          git checkout --detach "refs/tags/${RELEASE_TAG}"
          [[ "$(git rev-parse HEAD)" == "$TAG_COMMIT" ]]
          echo "tag_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate package version from selected tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAG_COMMIT: ${{ steps.tag.outputs.tag_commit }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$RELEASE_TAG" == "v$VERSION" ]]
          [[ "$(git rev-parse HEAD)" == "$TAG_COMMIT" ]]
          echo "tag_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=portreach-dist-$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_publish == 'publish' }}
    needs: validate-release
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        # Immutable SHA pins prevent mutable-tag substitution; update after reviewed upstream releases.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Confirm checked out validated release commit
        env:
          EXPECTED_COMMIT: ${{ needs.validate-release.outputs.tag_commit }}
        run: python -c "import os, subprocess; assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['EXPECTED_COMMIT']"

      - name: Set up Python ${{ matrix.python-version }}
        # Immutable SHA pins improve reproducibility but require deliberate updates.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src tests

      - name: Unit tests
        run: pytest

  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_publish == 'publish' }}
    needs: [validate-release, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
    steps:
      - name: Check out release tag
        # Immutable SHA pins prevent mutable-tag substitution; update after reviewed upstream releases.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Set up Python
        # Immutable SHA pins improve reproducibility but require deliberate updates.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate selected tag and package version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
          EXPECTED_COMMIT: ${{ needs.validate-release.outputs.tag_commit }}
          EXPECTED_VERSION: ${{ needs.validate-release.outputs.version }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.validate-release.outputs.artifact_name }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$CONFIRM_PUBLISH" == "publish" ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]]
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$RELEASE_TAG" == "v$VERSION" ]]
          [[ "$VERSION" == "$EXPECTED_VERSION" ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$EXPECTED_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Refuse an already-published version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          url = f"https://pypi.org/pypi/portreach/{os.environ['VERSION']}/json"
          try:
              with urllib.request.urlopen(url, timeout=15):
                  raise SystemExit("This PortReach version already exists on PyPI; refusing duplicate publication.")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          PY

      - name: Install build and validation tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions and exact artifact set
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python -m twine check dist/*
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          expected = {
              f"portreach-{version}-py3-none-any.whl",
              f"portreach-{version}.tar.gz",
          }
          actual = {path.name for path in Path("dist").iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"Unexpected dist contents: {sorted(actual)}")
          PY

      - name: Upload verified distributions
        # Immutable SHA pin; maintain through reviewed dependency updates.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_publish == 'publish' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/portreach/
    permissions:
      id-token: write
    steps:
      - name: Download the verified build artifact
        # Immutable SHA pin; maintain through reviewed dependency updates.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Verify downloaded artifact set
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test -f "dist/portreach-${VERSION}-py3-none-any.whl"
          test -f "dist/portreach-${VERSION}.tar.gz"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Publish exact verified artifact to PyPI
        # Official PyPA publisher pinned to the immutable v1.14.2 commit SHA.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: false
